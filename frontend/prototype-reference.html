<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Team Alpha NexHire - standalone smart recruitment matching platform prototype">
  <title>NexHire | Team Alpha Smart Recruitment Platform</title>
  <style>
    :root {
      --navy:#0b2545;
      --navy-2:#123b67;
      --teal:#0b8f8a;
      --teal-2:#12aaa3;
      --orange:#e66b1a;
      --green:#27824b;
      --purple:#6b55ad;
      --red:#c93e4f;
      --ink:#172033;
      --muted:#637083;
      --line:#dbe3eb;
      --soft:#f3f7fa;
      --white:#fff;
      --shadow:0 16px 40px rgba(11,37,69,.11);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#f6f8fb;line-height:1.5}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    img{max-width:100%}
    .skip{position:fixed;left:16px;top:-80px;z-index:9999;background:#fff;color:var(--navy);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow)}
    .skip:focus{top:16px}
    :focus-visible{outline:3px solid rgba(230,107,26,.45);outline-offset:3px}
    .hidden{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .container{width:min(1160px,calc(100% - 40px));margin:auto}
    .public-nav{height:76px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60;backdrop-filter:blur(12px)}
    .public-nav .container{height:100%;display:flex;align-items:center;gap:28px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:850;color:var(--navy);letter-spacing:-.02em}
    .brand-mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--navy),var(--teal));display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 10px 25px rgba(11,143,138,.25)}
    .brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.13em;font-weight:700}
    .nav-links{display:flex;align-items:center;gap:24px;margin-left:auto}
    .nav-links a{font-size:14px;font-weight:700;color:#425066}
    .nav-links a:hover{color:var(--teal)}
    .nav-actions{display:flex;align-items:center;gap:10px}
    .btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s ease;white-space:nowrap}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:var(--navy);color:#fff;box-shadow:0 9px 20px rgba(11,37,69,.18)}
    .btn-primary:hover{background:#12365e}
    .btn-teal{background:var(--teal);color:#fff}
    .btn-orange{background:var(--orange);color:#fff}
    .btn-light{background:#fff;color:var(--navy);border:1px solid var(--line)}
    .btn-soft{background:#eaf3f4;color:#08756f}
    .btn-danger{background:#fff0f1;color:var(--red);border:1px solid #f3c8ce}
    .btn-sm{padding:8px 11px;border-radius:10px;font-size:12px}
    .btn-block{width:100%}
    .icon-btn{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--navy);display:grid;place-items:center;font-weight:900}
    .hero{background:radial-gradient(circle at 88% 18%,rgba(18,170,163,.24),transparent 28%),linear-gradient(135deg,#071d37 0%,#0d3560 62%,#075f67 100%);color:#fff;min-height:650px;display:flex;align-items:center;overflow:hidden}
    .hero-grid{display:grid;grid-template-columns:1.06fr .94fr;gap:60px;align-items:center;padding:76px 0}
    .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;font-weight:850;color:var(--teal)}
    .hero .eyebrow{color:#75e4dc}
    h1,h2,h3,h4,p{margin-top:0}
    .hero h1{font-size:clamp(42px,6vw,72px);line-height:1.03;letter-spacing:-.055em;margin:18px 0 22px;max-width:760px}
    .hero h1 span{color:#7be5dc}
    .hero-copy{font-size:18px;color:#d9e8f3;max-width:650px}
    .hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0}
    .trust-line{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:#bcd0df}
    .trust-line span:before{content:"✓";color:#7be5dc;font-weight:900;margin-right:7px}
    .hero-board{background:rgba(255,255,255,.97);color:var(--ink);border-radius:28px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.28);transform:rotate(1.2deg);position:relative}
    .hero-board:before{content:"";position:absolute;inset:-14px 38px auto;height:15px;border-radius:15px 15px 0 0;background:rgba(255,255,255,.15)}
    .board-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .board-head strong{color:var(--navy)}
    .live-dot{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--green);font-weight:800}
    .live-dot:before{content:"";width:8px;height:8px;background:#3cc36b;border-radius:50%;box-shadow:0 0 0 5px rgba(60,195,107,.12)}
    .match-showcase{display:grid;grid-template-columns:104px 1fr;gap:18px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fbfdff}
    .score-ring{--score:88;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) calc(var(--score)*1%),#e6eef1 0);position:relative}
    .score-ring:after{content:"";position:absolute;width:68px;height:68px;background:#fff;border-radius:50%}
    .score-ring strong{position:relative;z-index:1;font-size:22px;color:var(--navy)}
    .micro-bars{display:grid;gap:10px;margin-top:18px}
    .micro-row{display:grid;grid-template-columns:80px 1fr 32px;gap:10px;align-items:center;font-size:11px;color:var(--muted)}
    .bar{height:7px;border-radius:10px;background:#e7edf2;overflow:hidden}
    .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--teal));border-radius:10px}
    .gap-card{margin-top:14px;padding:14px;border-radius:14px;background:#fff7ee;border:1px solid #f4d5b6;display:flex;justify-content:space-between;gap:16px;align-items:center;font-size:12px}
    .section{padding:84px 0}
    .section-white{background:#fff}
    .section-head{max-width:720px;margin-bottom:36px}
    .section-head h2{font-size:clamp(30px,4vw,48px);line-height:1.08;letter-spacing:-.04em;color:var(--navy);margin:10px 0 14px}
    .section-head p{color:var(--muted);font-size:17px}
    .feature-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff}
    .feature{padding:28px;min-height:220px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
    .feature:nth-child(3n){border-right:0}
    .feature:nth-last-child(-n+3){border-bottom:0}
    .feature-num{width:38px;height:38px;border-radius:12px;background:#eaf5f5;color:var(--teal);display:grid;place-items:center;font-weight:900;margin-bottom:20px}
    .feature h3{font-size:18px;color:var(--navy);margin-bottom:9px}
    .feature p{font-size:14px;color:var(--muted);margin:0}
    .jobs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .job-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;transition:.2s ease;position:relative}
    .job-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#bdcedc}
    .job-card-top{display:flex;gap:14px;align-items:flex-start}
    .company-logo{width:48px;height:48px;border-radius:14px;background:#eaf2f7;color:var(--navy);display:grid;place-items:center;font-weight:900;flex:none}
    .job-card h3{font-size:17px;margin:1px 0 4px;color:var(--navy)}
    .muted{color:var(--muted)}
    .small{font-size:12px}
    .job-meta{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
    .tag,.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;background:#eef3f7;color:#526174}
    .tag{border-radius:8px}
    .badge-green{background:#e8f6ed;color:#237745}
    .badge-orange{background:#fff2e8;color:#b95715}
    .badge-blue{background:#eaf2ff;color:#295da7}
    .badge-red{background:#fdecef;color:#b52d40}
    .badge-purple{background:#f0ecfa;color:#624aa0}
    .badge-teal{background:#e5f7f5;color:#087a75}
    .card-foot{display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px solid var(--line)}
    .cta-band{background:linear-gradient(120deg,var(--navy),#174c78);color:#fff;border-radius:28px;padding:48px;display:flex;align-items:center;justify-content:space-between;gap:30px}
    .cta-band h2{font-size:34px;letter-spacing:-.03em;margin-bottom:8px}
    .cta-band p{color:#c8dae8;margin:0}
    footer{background:#071a31;color:#b5c6d5;padding:48px 0 28px}
    .footer-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:40px}
    footer h4{color:#fff}
    footer a{display:block;margin:8px 0;font-size:13px}
    .footer-bottom{margin-top:36px;padding-top:22px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;display:flex;justify-content:space-between;gap:20px}

    .auth-page{min-height:100vh;display:grid;grid-template-columns:.92fr 1.08fr;background:#fff}
    .auth-brand{padding:48px;background:radial-gradient(circle at 85% 15%,rgba(20,180,172,.22),transparent 28%),linear-gradient(145deg,#071d37,#0c3c69 70%,#08736f);color:#fff;display:flex;flex-direction:column;justify-content:space-between}
    .auth-brand h1{font-size:clamp(38px,5vw,62px);line-height:1.05;letter-spacing:-.05em;margin:44px 0 18px}
    .auth-brand p{color:#cfdfeb;max-width:590px}
    .auth-points{display:grid;gap:12px;margin-top:32px}
    .auth-point{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.08);padding:14px;border:1px solid rgba(255,255,255,.1);border-radius:14px}
    .auth-point b{color:#7be5dc}
    .auth-side{display:grid;place-items:center;padding:44px}
    .auth-card{width:min(500px,100%)}
    .auth-card h2{font-size:34px;color:var(--navy);letter-spacing:-.03em;margin-bottom:8px}
    .demo-box{background:#f2f7fa;border:1px solid var(--line);border-radius:14px;padding:14px;margin:18px 0}
    .demo-accounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
    .demo-login{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:11px;text-align:left;color:var(--navy);font-weight:800}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field{display:grid;gap:7px;margin-bottom:15px}
    .field label{font-size:12px;font-weight:800;color:#3f4c60}
    .field input,.field select,.field textarea{width:100%;border:1px solid #cfd9e3;background:#fff;border-radius:11px;padding:11px 12px;color:var(--ink);transition:.15s}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(11,143,138,.1);outline:0}
    .field textarea{min-height:92px;resize:vertical}
    .help{font-size:11px;color:var(--muted)}
    .form-error{color:var(--red);font-size:12px;margin-top:5px}
    .check-row{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:var(--muted)}

    .app-shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}
    .sidebar{background:#071d37;color:#d7e3ec;padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}
    .sidebar .brand{color:#fff;padding:0 8px 24px}
    .sidebar .brand small{color:#8fa7bb}
    .role-chip{margin:0 8px 22px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.08);font-size:11px;color:#a9bfd0}
    .role-chip strong{display:block;color:#fff;font-size:13px;margin-top:2px}
    .side-label{padding:12px 12px 7px;text-transform:uppercase;letter-spacing:.13em;color:#68849a;font-size:9px;font-weight:900}
    .side-nav{display:grid;gap:4px}
    .side-nav button{border:0;background:transparent;color:#b7c9d7;padding:11px 12px;border-radius:10px;text-align:left;font-size:13px;font-weight:700;display:flex;align-items:center;gap:11px;width:100%}
    .side-nav button:hover,.side-nav button.active{background:rgba(21,170,162,.16);color:#fff}
    .side-nav button.active{box-shadow:inset 3px 0 0 #37c9c0}
    .nav-icon{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:10px;font-weight:900}
    .sidebar-bottom{margin-top:24px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1)}
    .app-main{min-width:0}
    .topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:16px;position:sticky;top:0;z-index:40}
    .topbar-title{font-weight:850;color:var(--navy);font-size:18px}
    .topbar-spacer{flex:1}
    .search-box{position:relative;width:min(360px,38vw)}
    .search-box input{width:100%;border:1px solid var(--line);background:#f6f8fa;border-radius:11px;padding:10px 12px 10px 37px}
    .search-box:before{content:"⌕";position:absolute;left:13px;top:7px;color:var(--muted);font-size:20px}
    .avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;display:grid;place-items:center;font-weight:850;font-size:12px}
    .content{padding:28px;max-width:1500px;margin:auto}
    .page-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:24px}
    .page-head h1{font-size:30px;letter-spacing:-.035em;color:var(--navy);margin-bottom:5px}
    .page-head p{color:var(--muted);margin:0}
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
    .stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;position:relative;overflow:hidden}
    .stat:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-28px;bottom:-30px;background:var(--stat-color,#dceff0)}
    .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:850}
    .stat-value{font-size:30px;line-height:1.1;color:var(--navy);font-weight:900;margin:8px 0 3px}
    .stat-note{font-size:11px;color:var(--muted)}
    .grid-2{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}
    .grid-equal{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;margin-bottom:18px}
    .panel-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}
    .panel-head h2,.panel-head h3{margin:0;color:var(--navy);font-size:17px}
    .panel-head p{margin:3px 0 0;font-size:12px;color:var(--muted)}
    .list{display:grid}
    .list-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
    .list-row:last-child{border-bottom:0}
    .list-main{min-width:0;flex:1}
    .list-main strong{display:block;color:var(--navy);font-size:14px}
    .list-main span{color:var(--muted);font-size:12px}
    .progress{height:8px;background:#e8eef2;border-radius:999px;overflow:hidden}
    .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#40c6be);border-radius:999px}
    .progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:7px}
    .filter-bar{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:10px;margin-bottom:18px}
    .filter-bar input,.filter-bar select{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}
    .app-job-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
    .app-job{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
    .app-job .match-line{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .match-number{font-size:24px;font-weight:900;color:var(--teal)}
    .skills{display:flex;gap:6px;flex-wrap:wrap}
    .data-table{width:100%;border-collapse:collapse;font-size:12px}
    .data-table th{text-align:left;color:#536176;background:#f2f6f8;padding:11px;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.07em}
    .data-table td{padding:12px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
    .data-table tr:last-child td{border-bottom:0}
    .data-table tr:hover td{background:#fbfdff}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}
    .empty{text-align:center;padding:44px 20px;color:var(--muted)}
    .empty-icon{width:58px;height:58px;border-radius:18px;margin:0 auto 14px;background:#edf3f6;color:var(--navy);display:grid;place-items:center;font-size:22px}
    .notice{padding:13px 14px;border-radius:12px;border:1px solid #bfe1df;background:#eef9f8;color:#146d68;font-size:12px;margin-bottom:16px}
    .notice.warning{border-color:#f0d3ad;background:#fff8ed;color:#8b571c}
    .notice.danger{border-color:#efc6cc;background:#fff2f4;color:#a52f40}
    .timeline{display:grid;gap:0}
    .timeline-item{display:grid;grid-template-columns:18px 1fr;gap:12px;position:relative;padding-bottom:20px}
    .timeline-item:before{content:"";position:absolute;left:8px;top:16px;bottom:0;width:2px;background:var(--line)}
    .timeline-item:last-child:before{display:none}
    .timeline-dot{width:18px;height:18px;border-radius:50%;background:#fff;border:5px solid var(--teal);z-index:1}
    .timeline-item strong{font-size:13px;color:var(--navy)}
    .timeline-item p{font-size:11px;color:var(--muted);margin:3px 0}
    .match-layout{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:start}
    .score-big{--score:75;width:138px;height:138px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) calc(var(--score)*1%),#e7edf1 0);position:relative}
    .score-big:after{content:"";position:absolute;width:106px;height:106px;background:#fff;border-radius:50%}
    .score-big div{position:relative;z-index:1;text-align:center}
    .score-big strong{display:block;font-size:31px;color:var(--navy)}
    .score-big span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .breakdown{display:grid;gap:13px}
    .break-row{display:grid;grid-template-columns:90px 1fr 72px;gap:12px;align-items:center;font-size:12px}
    .break-row b{text-align:right;color:var(--navy)}
    .gap-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
    .gap-action{border:1px solid #f0cfaa;background:#fffaf3;border-radius:11px;padding:12px;font-size:12px}
    .gap-action strong{color:#9a5517}
    .profile-top{display:grid;grid-template-columns:130px 1fr;gap:22px;align-items:center}
    .profile-avatar{width:120px;height:120px;border-radius:30px;background:linear-gradient(145deg,var(--navy),var(--teal));color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900}
    .skill-editor{display:flex;gap:8px;flex-wrap:wrap}
    .skill-chip{display:inline-flex;align-items:center;gap:7px;background:#edf5f6;color:#136e6a;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:750}
    .skill-chip button{border:0;background:transparent;color:#8a4050;padding:0;font-weight:900}
    .dropzone{border:2px dashed #b9cbd7;background:#f7fafc;border-radius:16px;padding:30px;text-align:center;transition:.18s}
    .dropzone.drag{border-color:var(--teal);background:#eefafa}
    .cv-layout{display:grid;grid-template-columns:.85fr 1.15fr;gap:18px}
    .cv-preview{background:#fff;box-shadow:0 8px 30px rgba(11,37,69,.12);border:1px solid var(--line);min-height:650px;padding:36px;color:#202a39}
    .cv-preview h1{color:var(--navy);font-size:30px;margin-bottom:4px}
    .cv-preview h3{color:var(--teal);border-bottom:2px solid #dbe9ea;padding-bottom:6px;margin-top:24px;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
    .cv-preview p,.cv-preview li{font-size:12px}
    .builder-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
    .builder-tabs button{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:9px;font-size:11px;font-weight:800;color:var(--muted)}
    .builder-tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .contact-card{display:grid;grid-template-columns:1fr auto;gap:16px;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}

    function calculateMatch(profile,job){
      if(!profile||!job){return {total:0,skills:0,experience:0,education:0,location:0,matched:[],missing:[],receipt:'Unavailable'};}
      var candidateSkills=(profile.skills||[]).map(function(s){return canonicalSkill(s.name).toLowerCase();});
      var totalWeight=job.required.reduce(function(n,s){return n+(Number(s.weight)||1);},0)||1;
      var earned=0,matched=[],missing=[];
      job.required.forEach(function(req){
        var ok=candidateSkills.indexOf(canonicalSkill(req.name).toLowerCase())>=0;
        if(ok){earned+=(Number(req.weight)||1);matched.push(req.name);}else{missing.push({name:req.name,must:req.must});}
      });
      var skills=Math.round(earned/totalWeight*100);
      var experience=job.experience>0?Math.min(100,Math.round((Number(profile.experienceYears)||0)/job.experience*100)):100;
      var education=educationScore(profile.education,job.education);
      var location=job.mode==='Remote'?100:(String(profile.location).toLowerCase()===String(job.location).toLowerCase()?100:(profile.relocate?75:20));
      var w=state.settings.weights;
      var total=Math.round(skills*w.skills/100+experience*w.experience/100+education*w.education/100+location*w.location/100);
      var jobEvidence=(job.required||[]).map(function(req){return canonicalSkill(req.name).toLowerCase()+'|'+(Number(req.weight)||1)+'|'+(req.must?'1':'0');}).sort().join(',');
      var snapshot=[profile.id,job.id,candidateSkills.sort().join('|'),profile.experienceYears,profile.education,profile.location,profile.relocate?'1':'0',jobEvidence,job.experience,job.education,job.location,job.mode,JSON.stringify(state.settings.weights),state.settings.ruleVersion].join(':');
      var hash=0;
      for(var i=0;i<snapshot.length;i++){hash=((hash<<5)-hash)+snapshot.charCodeAt(i);hash|=0;}
      return {total:total,skills:skills,experience:experience,education:education,location:location,matched:matched,missing:missing,receipt:state.settings.ruleVersion+'-'+Math.abs(hash).toString(16).toUpperCase()};
    }

    function applyLifecycleRules(){
      var changed=false;
      state.jobs.forEach(function(job){
        if(job.status==='Active'&&job.expiresAt<today()){
          job.status='Expired';job.lastActivity=today();changed=true;
          addAudit('System','Vacancy expired',job.title,'Expiry boundary enforced automatically');
        }
      });
      state.contacts.forEach(function(contact){
        if(contact.status==='Pending'&&contact.expiresAt<today()){
          var contactJob=jobById(contact.jobId),contactCandidate=getUser(contact.candidateId);
          contact.status='Expired';contact.respondedAt=today();changed=true;
          addNotification(contact.candidateId,'contact','Contact request expired',(contactJob?contactJob.title:'Vacancy')+' contact request expired without releasing details.');
          addNotification(contact.employerId,'contact','Contact request expired',(contactCandidate?contactCandidate.name:'Candidate')+' did not accept before expiry.');
          addAudit('System','Contact request expired',contact.id,'No contact details released');
        }
      });
      if(changed){save();}
    }
    function expirePendingContacts(predicate,reason){
      var count=0;
      state.contacts.forEach(function(contact){
        if(contact.status!=='Pending'||!predicate(contact)){return;}
        var contactJob=jobById(contact.jobId),candidate=getUser(contact.candidateId);
        contact.status='Expired';contact.respondedAt=today();count++;
        addNotification(contact.candidateId,'contact','Contact request cancelled',(contactJob?contactJob.title:'Vacancy')+' contact request ended: '+reason+'. No details were released.');
        addNotification(contact.employerId,'contact','Contact request cancelled',(candidate?candidate.name:'Candidate')+' contact request ended: '+reason+'.');
        addAudit('System','Contact request cancelled',contact.id,reason+'; no contact details released');
      });
      return count;
    }

    function applyJob(jobId){
      var user=me();
      if(!user||user.role!=='candidate'){closeModal();go('login');return;}
      var job=jobById(jobId),p=profileForUser(user.id);
      var company=jobCompany(job),owner=company?getUser(company.ownerId):null;
      if(!job||!company||!owner||!owner.active||company.verification!=='Verified'||job.moderation!=='Approved'){toast('This vacancy is not available for applications.','error');return;}
      if(state.applications.some(function(a){return a.jobId===jobId&&a.candidateId===user.id;})){toast('Duplicate application blocked for this vacancy.','error');return;}
      if(job.status!=='Active'||job.expiresAt<today()){toast('This vacancy is no longer accepting applications.','error');return;}
      if(!p.cv){closeModal();go('c-cv');toast('Upload or build a CV before applying.','error');return;}
      if(!p.title||!p.location||!p.school||!p.skills||!p.skills.length||!user.phone){closeModal();go('c-profile');toast('Complete your title, location, institution, phone and at least one confirmed skill before applying.','error');return;}
      var app={id:uid('ap'),jobId:jobId,candidateId:user.id,status:'Submitted',appliedAt:today(),updatedAt:today(),history:[{status:'Submitted',at:today()}]};
      state.applications.unshift(app);
      var owner=getUser(jobCompany(job).ownerId);
      addNotification(owner.id,'application','New applicant received',user.name+' applied for '+job.title+'.');
      addAudit(user.name,'Application submitted',job.title,'Unique candidate + vacancy record created');
      save();closeModal();render();toast('Application submitted. Your receipt is now visible.');
    }
    function sendContact(appId){
      var current=me();
      if(!current||current.role!=='employer'){toast('Employer access required.','error');return;}
      var app=state.applications.find(function(a){return a.id===appId;});
      if(!app){toast('Application record was not found.','error');return;}
      var candidate=getUser(app.candidateId),p=candidate?profileForUser(candidate.id):null,job=jobById(app.jobId);
      if(!candidate||!p){toast('Candidate profile was not found.','error');return;}
      if(!job||!jobCompany(job)||jobCompany(job).ownerId!==current.id){toast('You are not authorized for this applicant.','error');return;}
      if(['Submitted','Under Review','Shortlisted'].indexOf(app.status)<0){toast('Contact requests are unavailable for this application state.','error');return;}
      if(!candidate.active||!p.visibility){toast('Candidate profile is not currently available for contact.','error');return;}
      if(!p.contactConsent){toast('Candidate has disabled new contact requests.','error');return;}
      var existing=state.contacts.find(function(c){return c.jobId===job.id&&c.candidateId===candidate.id&&c.employerId===current.id;});
      if(existing){toast('A contact request decision is already recorded for this candidate and vacancy.','error');return;}
      var expires=new Date();expires.setDate(expires.getDate()+state.settings.contactExpiryDays);
      state.contacts.unshift({id:uid('ct'),jobId:job.id,employerId:current.id,candidateId:candidate.id,status:'Pending',message:'We would like to discuss the '+job.title+' role.',createdAt:today(),expiresAt:expires.toISOString().slice(0,10),respondedAt:null});
      addNotification(candidate.id,'contact','New contact request',companyForUser(me().id).name+' would like to contact you about '+job.title+'.');
      addAudit(current.name,'Contact request sent',candidate.name,'Direct details remain hidden pending consent');
      save();closeModal();render();toast('Contact request sent. Details remain private until acceptance.');
    }

        return;
      }
      if(el.id==='cvFile'&&el.files&&el.files[0]){handleCvFile(el.files[0]);}
    });
    document.addEventListener('input',function(event){
      var el=event.target;
      if(el.matches('[data-filter="q"]')){ui.jobFilter.q=el.value;clearTimeout(ui.filterTimer);ui.filterTimer=setTimeout(render,180);}
    });
    function handleCvFile(file){
      if(!hasRole('candidate')){toast('Job seeker access required.','error');return;}
      if(!file){toast('Choose a CV file.','error');return;}
      var allowed=['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
      var ext=(file.name.split('.').pop()||'').toLowerCase();
      if(allowed.indexOf(file.type)<0&&['pdf','doc','docx'].indexOf(ext)<0){toast('Only PDF, DOC and DOCX files are allowed.','error');return;}
      if(file.size>state.settings.cvMaxMb*1024*1024){toast('CV file exceeds the '+state.settings.cvMaxMb+' MB limit.','error');return;}
      var p=profileForUser(me().id);if(!p){toast('Candidate profile was not found.','error');return;}p.cv={source:'upload',fileName:file.name,size:file.size,uploadedAt:today(),mime:file.type||ext};addAudit(me().name,'CV metadata replaced','Candidate CV',file.name+' • '+file.size+' bytes');save();render();toast('CV validated and attached in this prototype.');
    }
    function downloadCv(){
      if(!hasRole('candidate')){toast('Job seeker access required.','error');return;}
      var p=profileForUser(me().id),content=cvPreview(p);
      var html='<!doctype html><html><head><meta charset="utf-8"><title>'+esc(me().name)+' CV</title><style>body{font-family:Arial,sans-serif;color:#202a39;max-width:800px;margin:40px auto;line-height:1.5}article{padding:30px}h1{color:#0b2545}h3{color:#0b8f8a;border-bottom:2px solid #dbe9ea;padding-bottom:6px;text-transform:uppercase;font-size:14px}p,li{font-size:13px}.muted{color:#637083}</style></head><body>'+content+'</body></html>';
      var blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(me().name.replace(/\s+/g,'_')||'Candidate')+'_NexHire_CV.html';a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);toast('Printable CV downloaded.');
    }
    function exportReport(){
      if(!hasRole('employer')){toast('Employer access required.','error');return;}
      var co=companyForUser(me().id),jobs=employerJobs(co.id),jobIds=jobs.map(function(j){return j.id;}),rows=[['Vacancy','Candidate','Match','Status','Applied']];
      state.applications.filter(function(a){return jobIds.indexOf(a.jobId)>=0;}).forEach(function(a){var j=jobById(a.jobId),u=getUser(a.candidateId),m=calculateMatch(profileForUser(u.id),j);rows.push([j.title,u.name,m.total+'%',a.status,a.appliedAt]);});
      var csv=rows.map(function(row){return row.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
      var blob=new Blob([csv],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='NexHire_Basic_Report_'+today()+'.csv';a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);toast('Basic report exported.');
    }
    function globalSearchModal(query){
      if(!me()){go('login');return;}
      var term=String(query||'').trim().toLowerCase();
      if(!term){toast('Enter a name, vacancy or skill to search.','error');return;}
      var role=me().role,items=[];
      if(role==='candidate'){
        items=activePublicJobs().filter(function(j){return (j.title+' '+j.description+' '+j.required.map(function(s){return s.name;}).join(' ')).toLowerCase().indexOf(term)>=0;}).map(function(j){return '<div class="list-row"><div class="company-logo">'+initials(jobCompany(j).name)+'</div><div class="list-main"><strong>'+esc(j.title)+'</strong><span>'+esc(jobCompany(j).name)+' • '+calculateMatch(profileForUser(me().id),j).total+'% match</span></div><button class="btn btn-light btn-sm" data-action="job-detail" data-id="'+j.id+'">Open</button></div>';});
      }else if(role==='employer'){
        var co=companyForUser(me().id);
        items=employerJobs(co.id).filter(function(j){return (j.title+' '+j.department+' '+j.required.map(function(s){return s.name;}).join(' ')).toLowerCase().indexOf(term)>=0;}).map(function(j){return '<div class="list-row"><div class="company-logo">'+initials(j.title)+'</div><div class="list-main"><strong>'+esc(j.title)+'</strong><span>'+esc(j.status)+' • '+state.applications.filter(function(a){return a.jobId===j.id;}).length+' applicants</span></div><button class="btn btn-light btn-sm" data-action="edit-job" data-id="'+j.id+'">Open</button></div>';});
      }else{
        var users=state.users.filter(function(u){return (u.name+' '+u.email+' '+u.role).toLowerCase().indexOf(term)>=0;}).map(function(u){return '<div class="list-row"><div class="avatar">'+initials(u.name)+'</div><div class="list-main"><strong>'+esc(u.name)+'</strong><span>'+esc(u.email)+' • '+esc(roleLabel(u.role))+'</span></div>'+statusBadge(u.active?'Active':'Suspended')+'</div>';});
        var jobs=state.jobs.filter(function(j){return (j.title+' '+jobCompany(j).name).toLowerCase().indexOf(term)>=0;}).map(function(j){return '<div class="list-row"><div class="company-logo">'+initials(j.title)+'</div><div class="list-main"><strong>'+esc(j.title)+'</strong><span>'+esc(jobCompany(j).name)+' • Vacancy</span></div>'+statusBadge(j.status)+'</div>';});
        items=users.concat(jobs);
      }
      openModal('<div class="modal-head"><div><h2>Search results</h2><div class="small muted">Results for “'+esc(query)+'”</div></div><button class="icon-btn" data-action="close-modal">×</button></div><div class="modal-body"><div class="list">'+(items.length?items.join(''):'<div class="empty"><div class="empty-icon">⌕</div><h3>No matching records</h3><p>Try a different name, skill or vacancy title.</p></div>')+'</div></div><div class="modal-foot"><button class="btn btn-primary" data-action="close-modal">Done</button></div>',false);
    }
    document.addEventListener('dragover',function(event){
      var zone=event.target.closest('#cvDrop');
      if(zone){event.preventDefault();zone.classList.add('drag');}
    });
    document.addEventListener('dragleave',function(event){
      var zone=event.target.closest('#cvDrop');
      if(zone){zone.classList.remove('drag');}
    });
    document.addEventListener('drop',function(event){
      var zone=event.target.closest('#cvDrop');
      if(zone){event.preventDefault();zone.classList.remove('drag');if(event.dataTransfer&&event.dataTransfer.files&&event.dataTransfer.files[0]){handleCvFile(event.dataTransfer.files[0]);}}
    });
    document.addEventListener('keydown',function(event){
      if(event.key==='Enter'&&event.target.matches('[data-action="global-search"]')){event.preventDefault();globalSearchModal(event.target.value);return;}
      if(event.key==='Escape'&&ui.modal){closeModal();}
    });
    window.addEventListener('hashchange',render);
    var initialUser=session&&me();
    if(!location.hash){location.hash=initialUser&&NAVS[initialUser.role]?NAVS[initialUser.role][0][0]:'home';}else{render();}
  })();
  </script>
</body>
</html>
