<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="../assets/auth.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="logo">Nex<span>Hire</span></div>
        <div>
          <h1>Choose a stronger lock.</h1>
          <p>A successful reset revokes every existing refresh session.</p>
        </div>
      </section>
      <section class="zone">
        <div class="card">
          <h2>Reset password</h2>
          <form id="resetForm">
            <label
              >Reset token
              <div class="input"><input id="token" required /></div></label
            ><label
              >New password
              <div class="input">
                <input
                  id="newPassword"
                  type="password"
                  required
                  minlength="8"
                /><button
                  type="button"
                  class="toggle"
                  data-toggle="newPassword"
                >
                  Show
                </button>
              </div></label
            ><label
              >Confirm password
              <div class="input">
                <input
                  id="confirmPassword"
                  type="password"
                  required
                /></div></label
            ><button class="primary" type="submit">Reset password</button>
            <div id="message" class="message"></div>
          </form>
          <div class="links"><a href="login.html">Back to sign in</a></div>
        </div>
      </section>
    </main>
    <script src="../assets/auth.js"></script>
  </body>
</html>
