<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NexHire Register</title>
    <link rel="stylesheet" href="../assets/auth.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="logo">Nex<span>Hire</span></div>
        <div>
          <h1>Build your future.</h1>
          <p>
            Create a Job Seeker or Employer account. Admin registration is
            blocked.
          </p>
        </div>
      </section>
      <section class="zone">
        <div class="card">
          <h2>Create account</h2>
          <form id="registerForm">
            <label
              >Full name
              <div class="input"><input id="fullName" required /></div
            ></label>
            <div class="row">
              <label
                >Email
                <div class="input">
                  <input id="email" type="email" required /></div></label
              ><label
                >Phone
                <div class="input"><input id="phone" /></div
              ></label>
            </div>
            <label
              >Account type
              <div class="input">
                <select id="role">
                  <option>JobSeeker</option>
                  <option>Employer</option>
                </select>
              </div></label
            ><label
              >Password
              <div class="input">
                <input
                  id="password"
                  type="password"
                  required
                  minlength="8"
                /><button type="button" class="toggle" data-toggle="password">
                  Show
                </button>
              </div></label
            ><label
              >Confirm password
              <div class="input">
                <input id="confirmPassword" type="password" required /></div
            ></label>
            <div class="hint">
              8–64 characters: uppercase, lowercase, number and symbol.
            </div>
            <button class="primary" type="submit">Create secure account</button>
            <div id="message" class="message"></div>
          </form>
          <div class="links">
            <a href="login.html">Already registered? Sign in</a>
          </div>
        </div>
      </section>
    </main>
    <script src="../assets/auth.js"></script>
  </body>
</html>
