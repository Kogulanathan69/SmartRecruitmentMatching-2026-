<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | NexHire</title><link rel="stylesheet" href="../assets/css/style.css"></head><body>
<main class="auth"><section class="authbox"><a class="brand" href="../index.html">Nex<span>Hire</span></a><h1>Create account</h1><p class="muted">Register, verify the OTP sent to your email, then login.</p>
<form class="form" onsubmit="registerUser(event)">
<input name="email" type="email" placeholder="Email" required>
<input name="password" type="password" placeholder="Password" required>
<input name="confirmPassword" type="password" placeholder="Confirm password" required>
<input name="firstName" placeholder="First name" required>
<input name="lastName" placeholder="Last name" required>
<input name="phoneNumber" placeholder="Phone number">
<select name="role"><option value="JobSeeker">JobSeeker</option><option value="Employer">Employer</option></select>
<button class="btn" type="submit">Register</button></form>
<p class="muted">Already registered? <a class="blue" href="login.html"><b>Login</b></a></p>
<p class="muted">Need verification? <a class="blue" href="verify-otp.html"><b>Verify OTP</b></a></p>
</section></main><div id="toast"></div><script src="../assets/js/api.js"></script><script src="../assets/js/auth.js"></script></body></html>
