<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NexHire Dashboard</title>
    <link rel="stylesheet" href="../assets/auth.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="logo">Nex<span>Hire</span></div>
        <div>
          <h1>Session active.</h1>
          <p>Your JWT-authenticated workspace is ready.</p>
        </div>
      </section>
      <section class="zone">
        <div class="card">
          <h2>Authentication successful</h2>
          <p class="muted" id="welcome"></p>
          <button class="primary" id="logoutButton">Sign out securely</button>
        </div>
      </section>
    </main>
    <script src="../assets/auth.js"></script>
    <script>
      if (!localStorage.accessToken) location = "login.html";
      document.getElementById("welcome").textContent =
        `Welcome ${localStorage.fullName || ""} · ${localStorage.role || "User"}`;
    </script>
  </body>
</html>
