<main class="auth"><section class="authbox"><a class="brand" href="../index.html">Nex<span>Hire</span></a><h1>Verify your email</h1><p class="muted">Enter the OTP sent to your email.</p>

</section></main><div id="toast"></div><script src="../assets/js/api.js"></script><script src="../assets/js/auth.js"></script>
