<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forgot Password</title>
    <link rel="stylesheet" href="../assets/auth.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="logo">Nex<span>Hire</span></div>
        <div>
          <h1>Recover access securely.</h1>
          <p>
            Reset tokens expire after 30 minutes and never reveal whether an
            account exists.
          </p>
        </div>
      </section>
      <section class="zone">
        <div class="card">
          <h2>Forgot password?</h2>
          <p class="muted">Enter your registered email.</p>
          <form id="forgotForm">
            <label
              >Email
              <div class="input">
                <input id="email" type="email" required /></div></label
            ><button class="primary" type="submit">Request reset token</button>
            <div id="message" class="message"></div>
          </form>
          <div class="links"><a href="login.html">Back to sign in</a></div>
        </div>
      </section>
    </main>
    <script src="../assets/auth.js"></script>
  </body>
</html>
