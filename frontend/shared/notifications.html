<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | NexHire</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div id="app">Loading...</div><div id="toast"></div><script src="../assets/js/api.js"></script><script src="../assets/js/ui.js"></script><script>async function load(){let role=localStorage.getItem('nexhire_role')||'JobSeeker';role=role.toLowerCase().includes('admin')?'Administrator':role.toLowerCase().includes('employer')?'Employer':'Job Seeker';let data=[];try{data=arr(await request('/api/notifications'))}catch(e){};document.body.innerHTML=shell(role,'Notification center','Notifications',`<div class="proto-head"><div><h1>Notification center</h1><p>Application, verification and account updates in one place.</p></div><button class="proto-btn teal" onclick="readAll()">Mark all read</button></div><section class="proto-panel" id="notiflist">${data.length?data.map(n=>`<div class="proto-row"><div class="proto-logo">NT</div><div><strong>${esc(n.title||n.type||'Notification')}</strong><small>${esc(n.message||'')}</small></div><span class="proto-badge ${n.isRead?'':'orange'}">${n.isRead?'Read':'New'}</span><button class="proto-btn light sm" onclick="readOne('${n.id||n.notificationId||''}')">Open</button></div>`).join(''):'<div class="proto-empty">You are all caught up.</div>'}</section>`)+`<div id="toast"></div>`}async function readAll(){try{await request('/api/notifications/read-all',{method:'PATCH'});toast('All notifications marked read');load()}catch(e){toast(e.message)}}async function readOne(id){try{await request('/api/notifications/'+id+'/read',{method:'PATCH'});load()}catch(e){toast(e.message)}}load()</script></body></html>
