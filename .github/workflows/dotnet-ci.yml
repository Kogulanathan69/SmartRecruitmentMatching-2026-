name: NexHire .NET CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore NexHire.sln

      - name: Build
        run: dotnet build NexHire.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/NexHire.UnitTests/NexHire.UnitTests.csproj --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx"

      - name: Run integration tests
        run: dotnet test tests/NexHire.IntegrationTests/NexHire.IntegrationTests.csproj --configuration Release --no-build --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

      - name: Docker build verification
        run: docker build -f src/NexHire.API/Dockerfile -t nexhire-api:ci .
