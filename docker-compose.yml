services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexhire-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-NexHire@12345}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - nexhire_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/NexHire.API/Dockerfile
    container_name: nexhire-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=NexHireDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-NexHire@12345};TrustServerCertificate=True;Encrypt=False;"
      Jwt__Key: "${JWT_KEY:-NexHire_Docker_Development_Key_Change_Before_Production_123456}"
      Jwt__Issuer: "NexHire"
      Jwt__Audience: "NexHireUsers"
      Jwt__ExpiryMinutes: "60"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  nexhire_sql_data:
